name: Scrape Tennis Data

on:
  schedule:
    # Daytime: Every 30 minutes from 6:30 AM to 10:30 PM
    - cron: '0,30 7-21 * * *'  # Every 30 minutes from 7 AM to 9 PM
    - cron: '30 6 * * *'       # 6:30 AM
    - cron: '0 22 * * *'       # 10:00 PM
    # Nighttime: Every 2 hours from 10:30 PM to 6:30 AM
    - cron: '30 22 * * *'      # 10:30 PM
    - cron: '30 0 * * *'       # 12:30 AM
    - cron: '30 2 * * *'       # 2:30 AM
    - cron: '30 4 * * *'       # 4:30 AM
    - cron: '30 6 * * *'       # 6:30 AM (already covered above)
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright browsers
        run: npx playwright install chromium
        
      - name: Run scraper
        run: npm run scrape
        
      - name: Aggregate data
        run: npm run aggregate
        
      - name: Commit and push data changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ src/data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update scraped tennis court data [skip ci]"
          git pull origin main --rebase
          git push 