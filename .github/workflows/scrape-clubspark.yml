name: Scrape Clubspark Data

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:

jobs:
  scrape-clubspark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Clubspark scraper
        run: node runner/scrape-clubspark-only.js

      - name: Aggregate data
        run: node aggregate-daily-to-location.js

      - name: Commit and push data changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ src/data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Clubspark data [skip ci]"
          git push 